name: Alte Seiten sichern

# Speichert die bisherigen WordPress-Seiten als Vorlage im Ordner alt/ (wird nicht veröffentlicht).
on:
  push:
    paths: ["tools/alt-seiten.txt", ".github/workflows/alt-seiten.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seiten laden
        run: |
          mkdir -p alt
          grep -v '^\s*#' tools/alt-seiten.txt | grep -v '^\s*$' | while read -r slug; do
            name=$(echo "$slug" | tr '/' '_')
            code=$(curl -sSL -A "Mozilla/5.0" -o "alt/$name.html" -w '%{http_code} %{url_effective}' "https://east-westflying.de/$slug/")
            echo "$slug -> $code" | tee -a alt/status.txt
          done
      - name: Hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alt
          git diff --cached --quiet || git commit -m "Alte Seiten als Vorlage gesichert"
          git push
